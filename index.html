
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AT Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px 15px;
      background: #0d1117;
      color: #fff;
      font-family: Tahoma, sans-serif;
      text-align: center;
    }
    h1 { color: #58a6ff; }
    .subtitle { color: #aaa; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 20px;
      margin: 16px auto;
      max-width: 360px;
    }
    .price {
      color: #3fb950;
      font-size: 20px;
      font-weight: bold;
    }
    button {
      padding: 12px 20px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #238636;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .note { color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
  <h1>AT SHOP</h1>
  <p class="subtitle">فروشگاه دیجیتال تلگرام</p>

  <div class="card">
    <h3>Telegram Premium</h3>
    <p>خرید اشتراک پریمیوم</p>
    <p class="price">قیمت: به‌زودی</p>
    <button onclick="order('Telegram Premium')">
      ثبت سفارش
    </button>
  </div>

  <div class="card">
    <h3>Telegram Stars</h3>
    <p>خرید استارز تلگرام</p>
    <p class="price">قیمت: به‌زودی</p>
    <button onclick="order('Telegram Stars')">
      ثبت سفارش
    </button>
  </div>

  <p class="note">
    برای اطلاع از قیمت و ثبت سفارش با پشتیبانی در ارتباط باش.
  </p>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function order(product) {
      const url =
        'https://t.me/Sculler_Support?text=' +
        encodeURIComponent(
          'سلام، برای خرید ' + product + ' پیام می‌دم.'
        );

      if (tg) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, '_blank');
      }
    }
  </script>
</body>
</html>
