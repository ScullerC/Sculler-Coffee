<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AT Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 25px 15px;
      background: #0d1117;
      color: white;
      font-family: Tahoma, sans-serif;
      text-align: center;
    }
    h1 { color: #58a6ff; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 24px;
      margin: 18px auto;
      max-width: 360px;
    }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #238636;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #status { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>AT SHOP</h1>
  <p>فروشگاه دیجیتال تلگرام</p>

  <div class="card">
    <h3>Telegram Premium</h3>
    <p>خرید اشتراک پریمیوم</p>
    <button onclick="buy('premium')">خرید پریمیوم</button>
  </div>

  <div class="card">
    <h3>Telegram Stars</h3>
    <p>خرید استارز</p>
    <button onclick="buy('stars')">خرید استارز</button>
  </div>

  <p id="status">یک محصول انتخاب کن.</p>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function buy(product) {
      if (!tg || !tg.initData) {
        document.getElementById('status').textContent =
          'فروشگاه را از داخل ربات تلگرام باز کن.';
        return;
      }

      tg.sendData(JSON.stringify({
        action: 'buy',
        product: product
      }));

      document.getElementById('status').textContent =
        'درخواست ارسال شد. منتظر پاسخ ربات باش.';
    }
  </script>
</body>
</html>
